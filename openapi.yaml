openapi: 3.1.0
info:
  title: AI Server API
  description: |
    HTTP surface implemented by `src/server/routes.ts` (canonical route table).

    **AI requests:** `POST /v1/query` and `POST /v1/query/async` accept the ingress `RequestEnvelope`
    JSON shape (see `src/ingress` and components schema). Authentication follows deployment config
    (AI JWT / headers as enforced by `validateIngress`).

    **Operational / admin:** When `OPERATIONAL_BEARER_TOKEN` is set, these routes require
    `Authorization: Bearer <token>` matching that value: `GET /healthz`, `GET /readyz`, `GET /metrics`,
    `GET /v1/version`, `GET /v1/preflight`, and all `/admin/flags*`. When the env var is unset, those
    checks are not applied (still use network controls in production).

    **Async jobs:** Job endpoints return `503` with `ASYNC_NOT_AVAILABLE` when no queue is configured.
  version: "2024-01-01"
  contact:
    name: AI Server Team
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.example.com
    description: Production server

paths:
  /healthz:
    get:
      summary: Liveness and dependency health
      operationId: getHealthz
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Healthy or degraded with dependency detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid
        "503":
          description: Unhealthy / degraded

  /readyz:
    get:
      summary: Readiness (dependencies ready for traffic)
      operationId: getReadyz
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid
        "503":
          description: Not ready

  /metrics:
    get:
      summary: Metrics snapshot or Prometheus text
      operationId: getMetrics
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [prometheus]
          description: Use `format=prometheus` or `Accept: text/plain` for Prometheus exposition
      responses:
        "200":
          description: JSON counters/histograms or Prometheus text
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
        "401":
          description: Operational bearer required but missing/invalid

  /v1/version:
    get:
      summary: Build and contract version
      operationId: getV1Version
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Version payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid

  /v1/preflight:
    get:
      summary: Production preflight report
      operationId: getV1Preflight
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Preflight pass
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid
        "503":
          description: Preflight failures present

  /token/exchange:
    post:
      summary: Exchange credentials for AI JWT (deployment-specific)
      operationId: postTokenExchange
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
        "4XX":
          description: Exchange rejected
        "5XX":
          description: Server error

  /v1/query:
    post:
      summary: Synchronous query (primary entrypoint)
      operationId: postV1Query
      tags: [Query]
      security:
        - AiJwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
      responses:
        "200":
          description: Response envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "4XX":
          description: Rejection / policy / rate limit
        "5XX":
          description: Server error

  /v1/query/async:
    post:
      summary: Submit async job (same ingress body as sync query)
      operationId: postV1QueryAsync
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: X-Webhook-Url
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
      responses:
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: accepted
                  job_id:
                    type: string
                  status_url:
                    type: string
                  created_at:
                    type: string
        "503":
          description: Async not available or rollout disabled

  /v1/jobs:
    get:
      summary: List jobs (filters via query string)
      operationId: listJobs
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: org_id
          in: query
          schema:
            type: string
        - name: app_id
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  jobs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  count:
                    type: integer
        "503":
          description: Async not available

  /v1/jobs/{jobId}:
    get:
      summary: Get job status and result
      operationId: getJob
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job record
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Job not found
        "503":
          description: Async not available

  /v1/jobs/{jobId}/cancel:
    post:
      summary: Cancel a pending or processing job
      operationId: cancelJob
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  job_id:
                    type: string
                  cancelled:
                    type: boolean
        "409":
          description: Cannot cancel
        "503":
          description: Async not available

  /admin/flags:
    get:
      summary: List feature flags
      operationId: adminListFlags
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized

  /admin/flags/evaluate:
    post:
      summary: Evaluate a flag for scope
      operationId: adminEvaluateFlag
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flag_name:
                  type: string
                org_id:
                  type: string
                app_id:
                  type: string
                user_id:
                  type: string
      responses:
        "200":
          description: Evaluation result
        "401":
          description: Unauthorized

  /admin/flags/overrides:
    post:
      summary: Create flag override
      operationId: adminCreateOverride
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
        "401":
          description: Unauthorized

  /admin/flags/overrides/{flagName}/{scope}/{scopeId}:
    delete:
      summary: Remove override for flag + scope + scope id
      operationId: adminDeleteOverride
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      parameters:
        - name: flagName
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: path
          required: true
          schema:
            type: string
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
        "401":
          description: Unauthorized

  /admin/flags/overrides/{scope}/{scopeId}:
    get:
      summary: List overrides for a scope
      operationId: adminListOverrides
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Overrides
        "401":
          description: Unauthorized

components:
  securitySchemes:
    AiJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AI JWT issued via token exchange or IdP (per deployment).
    OperationalBearerAuth:
      type: http
      scheme: bearer
      description: |
        When `OPERATIONAL_BEARER_TOKEN` is set, value must match `Authorization: Bearer <token>`.
        When unset, the server does not enforce this scheme on operational routes.

  schemas:
    RequestEnvelope:
      type: object
      required:
        - version
        - request_id
        - timestamp
        - intent
      properties:
        version:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        intent:
          $ref: "#/components/schemas/IntentBundle"
        pipeline_hint:
          type: object
          additionalProperties: true

    IntentBundle:
      type: object
      required:
        - intent_id
        - scope
        - input_artifacts
      properties:
        intent_id:
          type: string
        scope:
          $ref: "#/components/schemas/Scope"
        input_artifacts:
          type: array
          items:
            $ref: "#/components/schemas/TypedArtifact"
        context_artifacts:
          type: array
          items:
            $ref: "#/components/schemas/TypedArtifact"
        policy_constraints:
          type: object
          additionalProperties: true

    Scope:
      type: object
      required:
        - org_id
        - app_id
        - user_id
      properties:
        org_id:
          type: string
        app_id:
          type: string
        user_id:
          type: string
        project_id:
          type: string

    TypedArtifact:
      type: object
      required:
        - artifact_id
        - artifact_kind
        - schema_ref
        - encoding
        - content
      properties:
        artifact_id:
          type: string
        artifact_kind:
          type: string
        schema_ref:
          type: string
        encoding:
          type: string
        content:
          type: object
          additionalProperties: true

    ResponseEnvelope:
      type: object
      required:
        - version
        - request_id
        - timestamp
        - status
      properties:
        version:
          type: string
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
        status:
          type: string
        trace_id:
          type: string
        error:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        error:
          $ref: "#/components/schemas/ErrorDetail"
