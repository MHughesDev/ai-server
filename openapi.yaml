openapi: 3.1.0
info:
  title: AI Server API
  description: |
    HTTP surface implemented by `src/server/routes.ts` (canonical route table).

    **AI requests:** `POST /v1/query` and `POST /v1/query/async` accept the ingress `RequestEnvelope`
    JSON shape (see `src/ingress` and components schema). Authentication follows deployment config
    (AI JWT / headers as enforced by `validateIngress`).

    **Operational / admin:** When `OPERATIONAL_BEARER_TOKEN` is set, these routes require
    `Authorization: Bearer <token>` matching that value: `GET /healthz`, `GET /readyz`, `GET /metrics`,
    `GET /v1/version`, `GET /v1/preflight`, and all `/admin/flags*`. When the env var is unset, those
    checks are not applied (still use network controls in production).

    **Async jobs:** Job endpoints return `503` with `ASYNC_NOT_AVAILABLE` when no queue is configured.

    **Sync vs async semantics:** `POST /v1/query` completes in one HTTP response and returns a `ResponseEnvelope`
    whose `mode` is always **`sync`** when present. Async work is **not** selected via `RequestEnvelope.mode`
    (`async` / `auto` are rejected). Use **`POST /v1/query/async`** for job submission: **`202`** + `job_id` when
    enqueued, or **`200`** + `ResponseEnvelope` when governance blocks before enqueue (same gate as sync), then
    poll **`GET /v1/jobs/{jobId}`** for accepted jobs. Optional header **`Idempotency-Key`** on **`POST /v1/query/async`** deduplicates job creation per tenant scope (see that path). JSON body **`idempotency_key`** and other unknown keys remain rejected (strict `RequestEnvelope`).
    Canonical JSON shapes match `src/contracts/request-envelope.ts` and `response-envelope.ts` (Zod).
  version: "2024-01-01"
  contact:
    name: AI Server Team
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://api.example.com
    description: Production server

paths:
  /healthz:
    get:
      summary: Liveness and dependency health
      operationId: getHealthz
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Healthy or degraded with dependency detail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid
        "504":
          description: Request processing timeout (`REQUEST_PROCESSING_TIMEOUT_MS`); `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Unhealthy / degraded

  /readyz:
    get:
      summary: Readiness (dependencies ready for traffic)
      operationId: getReadyz
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Not ready

  /metrics:
    get:
      summary: Metrics snapshot or Prometheus text
      operationId: getMetrics
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [prometheus]
          description: Use `format=prometheus` or `Accept: text/plain` for Prometheus exposition
      responses:
        "200":
          description: JSON counters/histograms or Prometheus text
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/plain:
              schema:
                type: string
        "401":
          description: Operational bearer required but missing/invalid
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"

  /v1/version:
    get:
      summary: Build and contract version
      operationId: getV1Version
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Version payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid
        "504":
          description: Request processing timeout (`REQUEST_PROCESSING_TIMEOUT_MS`); `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"

  /v1/preflight:
    get:
      summary: Production preflight report
      operationId: getV1Preflight
      tags: [Operations]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Preflight pass
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Operational bearer required but missing/invalid
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Preflight failures present

  /token/exchange:
    post:
      summary: Exchange credentials for AI JWT (deployment-specific)
      operationId: postTokenExchange
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: integer
        "4XX":
          description: Exchange rejected
        "504":
          description: Request processing timeout after body read; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "5XX":
          description: Server error

  /v1/query:
    post:
      summary: Synchronous query (primary entrypoint)
      description: |
        Returns `ResponseEnvelope` on success. When `runtime_mvp_query_chat_enabled` is off, returns **404**
        with `ApiPlainError` (`error.code` **`MVP_QUERY_DISABLED`**) — not a full `ResponseEnvelope`.
      operationId: postV1Query
      tags: [Query]
      security:
        - AiJwtAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
      responses:
        "200":
          description: Response envelope (`mode` is `sync` when present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "404":
          description: MVP query disabled (`MVP_QUERY_DISABLED`) or rare routing cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"
        "408":
          description: Request body read timeout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "499":
          description: Client closed connection before body completed (`RequestAbortedError`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "504":
          description: Request processing timeout (`withRequestTimeout`); `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "4XX":
          description: Other rejection / policy / rate limit (`ResponseEnvelope` or ingress error body per `routes.ts`)
        "5XX":
          description: Server error

  /v1/query/async:
    post:
      summary: Submit async job (same ingress body as sync query)
      operationId: postV1QueryAsync
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: X-Webhook-Url
          in: header
          required: false
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            When present, duplicate submits with the same key and identical logical body (caller + input + preferences + mode + deadline + contract_version; not `request_id`) return the same `job_id`.
            Same key with a different body returns 409 `IDEMPOTENCY_KEY_CONFLICT`. Scoped by caller org/app/user. Max 256 characters after trim.
          schema:
            type: string
            maxLength: 256
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestEnvelope"
      responses:
        "200":
          description: |
            Governance blocked the request before enqueue (same `ResponseEnvelope` as `POST /v1/query` when `status` is `blocked` or `error`); no job is created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseEnvelope"
        "202":
          description: Job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAccepted"
        "400":
          description: Invalid payload (e.g. Idempotency-Key too long)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "409":
          description: Idempotency-Key reused with a different request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"
        "504":
          description: Request processing timeout (`withRequestTimeout` on governance through enqueue); `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Async queue not configured (`ASYNC_NOT_AVAILABLE`) or production rollout disabled (`POLICY_BLOCKED`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"

  /v1/jobs:
    get:
      summary: List jobs (filters via query string)
      operationId: listJobs
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: org_id
          in: query
          schema:
            type: string
        - name: app_id
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  jobs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  count:
                    type: integer
        "504":
          description: Request processing timeout (`withRequestTimeout`); `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Async not available (`ASYNC_NOT_AVAILABLE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"

  /v1/jobs/{jobId}:
    get:
      summary: Get job status and result
      operationId: getJob
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job record
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid job id (`INVALID_JOB_ID`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"
        "404":
          description: Job not found (`JOB_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"
        "504":
          description: Request processing timeout (`withRequestTimeout`); `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Async not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"

  /v1/jobs/{jobId}/cancel:
    post:
      summary: Cancel a pending or processing job
      operationId: cancelJob
      tags: [Jobs]
      security:
        - AiJwtAuth: []
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  job_id:
                    type: string
                  cancelled:
                    type: boolean
        "400":
          description: Invalid job id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"
        "409":
          description: Cannot cancel (`CANNOT_CANCEL`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"
        "504":
          description: Request processing timeout (`withRequestTimeout`); `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Async not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"

  /admin/flags:
    get:
      summary: List feature flags
      operationId: adminListFlags
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Unauthorized
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"
        "503":
          description: Flag service not initialized (`FLAGS_NOT_AVAILABLE`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiPlainError"

  /admin/flags/evaluate:
    post:
      summary: Evaluate a flag for scope
      operationId: adminEvaluateFlag
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flag_name:
                  type: string
                org_id:
                  type: string
                app_id:
                  type: string
                user_id:
                  type: string
      responses:
        "200":
          description: Evaluation result
        "401":
          description: Unauthorized
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"

  /admin/flags/overrides:
    post:
      summary: Create flag override
      operationId: adminCreateOverride
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "201":
          description: Created
        "401":
          description: Unauthorized
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"

  /admin/flags/overrides/{flagName}/{scope}/{scopeId}:
    delete:
      summary: Remove override for flag + scope + scope id
      operationId: adminDeleteOverride
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      parameters:
        - name: flagName
          in: path
          required: true
          schema:
            type: string
        - name: scope
          in: path
          required: true
          schema:
            type: string
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Removed
        "401":
          description: Unauthorized
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"

  /admin/flags/overrides/{scope}/{scopeId}:
    get:
      summary: List overrides for a scope
      operationId: adminListOverrides
      tags: [Admin]
      security:
        - OperationalBearerAuth: []
      parameters:
        - name: scope
          in: path
          required: true
          schema:
            type: string
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Overrides
        "401":
          description: Unauthorized
        "504":
          description: Request processing timeout; `error.code` is `TIMEOUT`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryIngressErrorBody"

components:
  securitySchemes:
    AiJwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: AI JWT issued via token exchange or IdP (per deployment).
    OperationalBearerAuth:
      type: http
      scheme: bearer
      description: |
        When `OPERATIONAL_BEARER_TOKEN` is set, value must match `Authorization: Bearer <token>`.
        When unset, the server does not enforce this scheme on operational routes.

  schemas:
    RequestCaller:
      type: object
      additionalProperties: false
      required: [app_id, user_id, org_id]
      properties:
        app_id:
          type: string
          minLength: 1
        user_id:
          type: string
          minLength: 1
        org_id:
          type: string
          minLength: 1
        session_id:
          type: string
        scopes:
          type: array
          items:
            type: string
          default: []

    RequestAttachment:
      type: object
      additionalProperties: false
      required: [id, type]
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum: [image, pdf, json, other]
        content_b64:
          type: string
        uri:
          type: string
          format: uri
        meta:
          type: object
          additionalProperties: false
          properties:
            filename:
              type: string
            mime:
              type: string

    RequestInput:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/RequestAttachment"
          default: []
        structured:
          type: object
          additionalProperties: true

    RequestPreferences:
      type: object
      additionalProperties: false
      required: [response_format, verbosity, stream]
      properties:
        response_format:
          type: string
          enum: [text, json, markdown]
        verbosity:
          type: string
          enum: [low, medium, high]
        stream:
          type: boolean

    RequestEnvelope:
      type: object
      additionalProperties: false
      description: |
        Strict ingress body for `POST /v1/query` and `POST /v1/query/async` (matches Zod `RequestEnvelopeSchema`).
        Unknown keys (e.g. `idempotency_key`, top-level `timestamp`) are rejected. `mode` may only be `"sync"` or omitted.
      required: [request_id, caller]
      properties:
        request_id:
          type: string
          format: uuid
        caller:
          $ref: "#/components/schemas/RequestCaller"
        input:
          $ref: "#/components/schemas/RequestInput"
          default: {}
        preferences:
          $ref: "#/components/schemas/RequestPreferences"
        mode:
          type: string
          enum: [sync]
        deadline_ms:
          type: integer
          minimum: 1
        contract_version:
          type: string
          default: "v1"

    ResponseCitation:
      type: object
      additionalProperties: false
      required: [source, ref]
      properties:
        source:
          type: string
        ref:
          type: string
        span:
          type: string

    ResponseOutputAttachment:
      type: object
      additionalProperties: false
      properties:
        artifact_uri:
          type: string
        artifact_id:
          type: string
        artifact_kind:
          type: string

    ResponseOutput:
      type: object
      additionalProperties: false
      properties:
        text:
          type: string
        structured:
          type: object
          additionalProperties: true
        citations:
          type: array
          items:
            $ref: "#/components/schemas/ResponseCitation"
          default: []
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/ResponseOutputAttachment"
          default: []

    ResponseTelemetry:
      type: object
      additionalProperties: false
      properties:
        pipeline:
          type: string
        models_used:
          type: array
          items:
            type: string
          default: []
        tool_calls:
          type: integer
          minimum: 0
          default: 0
        tokens_in:
          type: integer
          minimum: 0
          default: 0
        tokens_out:
          type: integer
          minimum: 0
          default: 0
        cost_usd_est:
          type: number
          minimum: 0
          default: 0
        latency_ms:
          type: integer
          minimum: 0
          default: 0

    ResponseErrorNested:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            Error discriminator. Matches Zod `ResponseEnvelopeSchema` (`z.string()`), so values are not limited to
            `ErrorCode` — e.g. pipelines may return `DEADLINE_EXCEEDED`, engines `RETRIEVAL_FAILED`, etc.
            HTTP/plain JSON routes prefer the closed set in `ErrorCode`.
        message:
          type: string
        detail:
          type: object
          additionalProperties: true

    ResponseEnvelope:
      type: object
      additionalProperties: false
      description: |
        Success path for `POST /v1/query` (matches Zod `ResponseEnvelopeSchema`). `mode` is always `sync` when present.
        When `status` is `error`, `error.code` is any string (see `ResponseErrorNested`).
      required: [request_id, status]
      properties:
        request_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [ok, blocked, error]
        output:
          $ref: "#/components/schemas/ResponseOutput"
        telemetry:
          $ref: "#/components/schemas/ResponseTelemetry"
        error:
          $ref: "#/components/schemas/ResponseErrorNested"
        mode:
          type: string
          enum: [sync]

    JobAccepted:
      type: object
      additionalProperties: false
      required: [status, job_id, status_url, created_at]
      properties:
        status:
          type: string
          enum: [accepted]
        job_id:
          type: string
        status_url:
          type: string
        created_at:
          type: string

    ErrorCode:
      type: string
      description: Client-stable codes; canonical list in `src/contracts/errors.ts`.
      enum:
        - AUTH_INVALID
        - RATE_LIMITED
        - POLICY_BLOCKED
        - BUDGET_EXCEEDED
        - TOOL_TIMEOUT
        - MODEL_FAILURE
        - INTERNAL_ERROR
        - INVALID_PAYLOAD
        - CONTRACT_VERSION_UNSUPPORTED
        - RETRIEVAL_UNAVAILABLE
        - ATTACHMENT_REJECTED
        - MULTIMODAL_UNSUPPORTED
        - IDEMPOTENCY_KEY_CONFLICT
        - ASYNC_NOT_AVAILABLE
        - INVALID_JOB_ID
        - JOB_NOT_FOUND
        - CANNOT_CANCEL
        - FLAGS_NOT_AVAILABLE
        - TIMEOUT
        - NOT_FOUND
        - MVP_QUERY_DISABLED

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
        detail:
          type: object
          additionalProperties: true

    ApiPlainError:
      type: object
      description: |
        Error JSON from `routes.ts`: always includes `error`. Some paths also set `status: "error"`
        (async submit idempotency conflict, rollout guard).
      properties:
        status:
          type: string
          enum: [error]
        error:
          $ref: "#/components/schemas/ErrorDetail"

    QueryIngressErrorBody:
      type: object
      description: Ingress-layer errors from `POST /v1/query` handler (timeouts, aborted read). Uses `error.detail` (not `details`).
      properties:
        request_id:
          type: string
          nullable: true
        status:
          type: string
          enum: [error]
        error:
          $ref: "#/components/schemas/ResponseErrorNested"

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        error:
          $ref: "#/components/schemas/ErrorDetail"
