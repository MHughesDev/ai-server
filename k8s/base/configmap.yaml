apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-server-config
  namespace: ai-server
data:
  LOG_LEVEL: "info"
  MAX_REQUEST_BODY_BYTES: "1000000"
  REQUEST_READ_TIMEOUT_MS: "30000"
  INGRESS_RATE_LIMIT_MAX_REQUESTS: "100"
  INGRESS_RATE_LIMIT_WINDOW_MS: "60000"
  MODEL_GATEWAY_TIMEOUT_MS: "25000"
  MODEL_GATEWAY_MAX_RETRIES: "2"
  MODEL_GATEWAY_DEFAULT_MODEL: "gpt-4"
  MODEL_GATEWAY_DEFAULT_CAPABILITY: "chat"
  AUTH_AI_JWT_ISSUER: "ai-server"
  AUTH_AI_JWT_AUDIENCE: "ai-server-query"
  AUTH_AI_JWT_TTL_SECONDS: "900"
  AUTH_QUERY_REQUIRED_SCOPES: "query:invoke"
  QUEUE_WORKERS_COUNT: "2"
  QUEUE_BACKEND: "redis"
  QUEUE_MAX_RETRIES: "3"
  QUEUE_WEBHOOK_TIMEOUT_MS: "30000"
  MEMORY_BACKEND: "vector"
  MEMORY_EMBEDDING_PROVIDER: "openai"
  MEMORY_EMBEDDING_MODEL: "text-embedding-3-small"
  MEMORY_EMBEDDING_DIMENSIONS: "1536"
  MEMORY_RETRIEVAL_TIMEOUT_MS: "1500"
  MEMORY_MAX_CONTEXT_TOKENS: "1000"
  MEMORY_MAX_CHUNKS_PER_INGEST: "128"
  MEMORY_PERSISTENT_BACKEND: "redis"
  FEATURE_FLAG_BACKEND: "config"
  FEATURE_FLAG_ENABLE_DYNAMIC: "true"
  FEATURE_FLAG_REFRESH_INTERVAL_MS: "60000"
  AUDIT_LOG_PATH: "/var/log/ai-server/audit.log"
  AUDIT_LOG_MAX_FILE_BYTES: "10485760"
  AUDIT_LOG_MAX_ROTATED_FILES: "5"
  OBSERVABILITY_EVENT_SINK_PATH: "/var/log/ai-server/events.log"
  OBSERVABILITY_EVENT_SINK_MAX_FILE_BYTES: "10485760"
  OBSERVABILITY_EVENT_SINK_MAX_ROTATED_FILES: "5"
  HTTPS_PORT: "3443"
  MAX_CONCURRENT_REQUESTS: "100"
  MAX_REQUEST_QUEUE_DEPTH: "50"
  CORS_ALLOWED_ORIGINS: "*"
  CORS_ALLOW_CREDENTIALS: "false"
