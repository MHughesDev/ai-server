apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-server
  namespace: ai-server
  labels:
    app.kubernetes.io/name: ai-server
    app.kubernetes.io/component: serviceaccount
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-server
  namespace: ai-server
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["ai-server-secrets"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-server
  namespace: ai-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-server
subjects:
  - kind: ServiceAccount
    name: ai-server
    namespace: ai-server
