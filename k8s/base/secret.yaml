apiVersion: v1
kind: Secret
metadata:
  name: ai-server-secrets
  namespace: ai-server
type: Opaque
stringData:
  # SECURITY WARNING: These are placeholder values.
  # Replace with actual secrets before deployment!
  # Use: kubectl create secret generic ai-server-secrets --from-literal=key=value
  
  OPERATIONAL_BEARER_TOKEN: "change-me-to-secure-random-token"
  # Set at deploy (required when PLATFORM_PRODUCTION_ROLLOUT_ENABLED=true)
  RELEASE_ID: "change-me-release-id"
  BUILD_ID: "change-me-build-id"
  MODEL_PROVIDER_API_KEY: "sk-your-openai-api-key"
  MODEL_GATEWAY_PROVIDERS_JSON: '[{"id":"openai","kind":"openai_compatible","default_model":"gpt-4","base_url":"https://api.openai.com/v1","api_key_env":"MODEL_PROVIDER_API_KEY","input_cost_per_million_usd":30.0,"output_cost_per_million_usd":60.0}]'
  AUTH_IDP_REGISTRY_JSON: '[{"issuer":"https://idp.local/default","audience":"ai-server-token-exchange","jwt_algorithm":"HS256","jwt_secret":"dev-external-idp-secret","claim_mapping":{}}]'
  AUTH_APP_REGISTRY_JSON: '[{"client_id":"app-client","client_secret":"dev-app-secret","app_id":"a1","allowed_issuers":["https://idp.local/default"],"allowed_scopes":["query:invoke"]}]'
  AUTH_AI_JWT_SECRET: "dev-ai-jwt-secret-change-me"
  MEMORY_EMBEDDING_API_KEY_ENV: "OPENAI_API_KEY"
  OPENAI_API_KEY: "sk-your-openai-api-key"
