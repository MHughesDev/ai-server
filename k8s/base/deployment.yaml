apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: ai-server
  labels:
    app.kubernetes.io/name: ai-server
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-server
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ai-server
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: ai-server
          image: ai-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: https
              containerPort: 3443
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ai-server-config
            - secretRef:
                name: ai-server-secrets
          env:
            - name: NODE_ENV
              value: "production"
            - name: SECRETS_BACKEND
              value: "env"
            - name: RELEASE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['app.kubernetes.io/version']
            - name: BUILD_ID
              value: "set-at-deploy-time"
            - name: MEMORY_BACKEND
              value: "vector"
            - name: REDIS_URL
              value: "redis://redis.ai-server.svc.cluster.local:6379"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          # Exec probes send Bearer token when OPERATIONAL_BEARER_TOKEN is set (see routes.ts).
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  node -e "const t=process.env.OPERATIONAL_BEARER_TOKEN;const h=t?{Authorization:'Bearer '+t}:{};fetch('http://127.0.0.1:3000/healthz',{headers:h}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  node -e "const t=process.env.OPERATIONAL_BEARER_TOKEN;const h=t?{Authorization:'Bearer '+t}:{};fetch('http://127.0.0.1:3000/readyz',{headers:h}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/ai-server
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir:
            sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - ai-server
                topologyKey: kubernetes.io/hostname
