apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-server-dev

namePrefix: dev-

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: ai-server
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
  - target:
      kind: Ingress
      name: ai-server
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: ai-server-dev.local

configMapGenerator:
  - name: ai-server-config
    behavior: merge
    literals:
      - LOG_LEVEL=debug
      - INGRESS_RATE_LIMIT_MAX_REQUESTS=0
      - MEMORY_BACKEND=in_memory
      - MEMORY_EMBEDDING_PROVIDER=hash
